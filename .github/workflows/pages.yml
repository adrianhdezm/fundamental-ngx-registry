# Builds every package's Storybook (each with its shadcn registry under /<package>/r) and the landing page, and
# publishes them to GitHub Pages:
#   https://adrianhdezm.github.io/fundamental-ui-registry/            landing page (site/index.html)
#   https://adrianhdezm.github.io/fundamental-ui-registry/angular/    Storybook of packages/angular
#   https://adrianhdezm.github.io/fundamental-ui-registry/angular/r/  its registry
name: Site on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces a queued one but never cancels a running deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
